name: Architecture baseline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -c constraints-test.txt
        working-directory: apps/api
      - run: python -m pytest tests -q -ra --junitxml=test-results/api.xml
        working-directory: apps/api
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lc_test_admin
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -c constraints-test.txt
        working-directory: apps/api
      - run: python -m scripts.run_postgres_tests
        working-directory: apps/api
        env:
          LC_TEST_PG_ADMIN_URL: postgresql://lc_test_admin:isolated-ci-only@127.0.0.1:5432/postgres
  browser:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: /api/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt -c constraints-test.txt
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm run lint && npm run test:config && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test tests/e2e/architecture-map.spec.ts --project=chromium
        working-directory: apps/web

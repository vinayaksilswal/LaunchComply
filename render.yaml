# API Docker service with external Neon PostgreSQL.
services:
  - type: web
    name: launchcomply-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: MIGRATE_ON_STARTUP
        value: "true"
      - key: PILOT_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
